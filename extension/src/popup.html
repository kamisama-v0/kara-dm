<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Kara DM</title>
<link rel="stylesheet" href="glass.css">
<style>
  body { width: 340px; padding: 10px; }
  header { display: flex; align-items: center; gap: 8px; padding: 4px 6px 10px; }
  header img { width: 22px; height: 22px; }
  header h1 { font-size: 14px; font-weight: 600; margin: 0; flex: 1; }
  .status { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--text-2); }
  #media .row { cursor: pointer; }
  #media .row:hover { background: var(--glass-hover); }
  .empty { padding: 10px; color: var(--text-2); font-size: 12px; }
  footer { display: flex; justify-content: space-between; padding: 8px 2px 0; }
  .done { color: var(--on); }
  .fail { color: var(--danger); }
</style>
</head>
<body>
  <header>
    <img src="icons/32.png" alt="">
    <h1>Kara DM</h1>
    <span class="status"><span class="dot" id="dot"></span><span id="status">Memeriksa…</span></span>
  </header>
  <div class="glass">
    <label class="row">
      <span class="grow">Tangkap unduhan</span>
      <span class="switch"><input type="checkbox" id="capture"><span></span></span>
    </label>
    <label class="row" id="siteRow">
      <span class="grow ellipsis">Matikan di <span id="site">situs ini</span></span>
      <span class="switch"><input type="checkbox" id="siteOff"><span></span></span>
    </label>
  </div>
  <div class="section">Media di tab ini</div>
  <div class="glass" id="media"><div class="empty">Memuat…</div></div>
  <footer>
    <button class="text" id="options">Pengaturan</button>
    <button class="text" id="help" title="Cara kerja">Tentang</button>
  </footer>
  <script src="common.js"></script>
  <script src="popup.js"></script>
</body>
</html>

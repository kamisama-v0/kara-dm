<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kara DM</title>
<link rel="stylesheet" href="glass.css">
<style>
  body { width: 340px; padding: 10px; }
  header { display: flex; align-items: center; gap: 8px; padding: 4px 6px 10px; }
  header img { width: 22px; height: 22px; }
  header h1 { font-size: 14px; font-weight: 600; margin: 0; flex: 1; }
  .status { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--text-2); }
  #media .row { cursor: pointer; }
  #media .row:hover { background: var(--glass-hover); }
  .empty { padding: 10px; color: var(--text-2); font-size: 12px; }
  footer { display: flex; justify-content: space-between; padding: 8px 2px 0; }
  #pageTools { margin-top: 8px; }
  .done { color: var(--on); }
  .fail { color: var(--danger); }
</style>
</head>
<body>
  <header>
    <img src="icons/32.png" alt="">
    <h1>Kara DM</h1>
    <span class="status"><span class="dot" id="dot"></span><span id="status">Checking…</span></span>
  </header>
  <div class="glass">
    <label class="row">
      <span class="grow">Catch downloads</span>
      <span class="switch"><input type="checkbox" id="capture"><span></span></span>
    </label>
    <label class="row" id="siteRow">
      <span class="grow ellipsis">Off on <span id="site">this site</span></span>
      <span class="switch"><input type="checkbox" id="siteOff"><span></span></span>
    </label>
  </div>
  <div class="glass" id="pageTools">
    <button class="row action" id="links">
      <span class="grow"><div>Download all links…</div><div class="sub">Pick files from this page</div></span>
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 3 5 5-5 5"/></svg>
    </button>
    <label class="row">
      <span class="grow"><div>Video quality</div><div class="sub">For page videos, HLS and DASH</div></span>
      <select id="quality"></select>
    </label>
  </div>
  <div class="section">Media in this tab</div>
  <div class="glass" id="media"><div class="empty">Loading…</div></div>
  <footer>
    <button class="text" id="options">Settings</button>
    <button class="text" id="help" title="How it works">About</button>
  </footer>
  <script src="common.js"></script>
  <script src="popup.js"></script>
</body>
</html>

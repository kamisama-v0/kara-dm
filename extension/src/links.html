<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Download links — Kara DM</title>
<link rel="stylesheet" href="glass.css">
<style>
  body { min-height: 100vh; padding: 40px 16px 96px; }
  main { max-width: 760px; margin: 0 auto; }
  header { display: flex; align-items: center; gap: 10px; margin: 0 6px 16px; }
  header img { width: 32px; height: 32px; }
  header .grow { flex: 1; min-width: 0; }
  h1 { font-size: 20px; font-weight: 600; margin: 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 4px 10px; }
  .chip {
    font: inherit; font-size: 12px; color: inherit; cursor: pointer; border-radius: 999px; padding: 6px 12px;
    background: var(--glass); border: 1px solid var(--hairline);
  }
  .chip:hover { background: var(--glass-hover); }
  .chip[aria-pressed="true"] { background: var(--on); border-color: transparent; color: #fff; }
  .chip .n { opacity: 0.7; margin-left: 4px; }
  .tools { display: flex; gap: 8px; align-items: center; margin: 0 4px 10px; }
  input[type="search"] {
    flex: 1; min-width: 0; font: inherit; color: inherit; border: 0; border-radius: 10px; padding: 8px 12px;
    background: rgba(127, 127, 127, 0.14);
  }
  #list .row { gap: 12px; cursor: pointer; }
  #list .row:hover { background: var(--glass-hover); }
  #list input[type="checkbox"] { width: 16px; height: 16px; margin: 0; accent-color: var(--on); flex: none; cursor: pointer; }
  .ext {
    flex: none; min-width: 44px; text-align: center; font-size: 10.5px; font-weight: 600; letter-spacing: 0.04em;
    text-transform: uppercase; color: var(--text-2); border-radius: 6px; padding: 3px 6px; background: rgba(127, 127, 127, 0.14);
  }
  .empty { padding: 14px; color: var(--text-2); }
  .bar {
    position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); width: min(760px, calc(100% - 32px));
    display: flex; align-items: center; gap: 12px; padding: 10px 10px 10px 18px;
  }
  .bar .grow { flex: 1; min-width: 0; }
  .primary {
    font: inherit; font-weight: 600; color: #fff; background: var(--on); border: 0; border-radius: 999px;
    padding: 9px 18px; cursor: pointer;
  }
  .primary:disabled { opacity: 0.45; cursor: default; }
  .done { color: var(--on); }
  .fail { color: var(--danger); }
  @media (max-width: 520px) { #list .host { display: none; } }
</style>
</head>
<body>
<main>
  <header>
    <img src="icons/48.png" alt="">
    <div class="grow">
      <h1>Download links</h1>
      <div class="sub ellipsis" id="page">Loading…</div>
    </div>
  </header>
  <div class="chips" id="chips" role="toolbar" aria-label="File types"></div>
  <div class="tools">
    <input type="search" id="search" placeholder="Filter by name or address…" aria-label="Filter links">
    <button class="text" id="all">Select all</button>
    <button class="text" id="none">Clear</button>
  </div>
  <div class="glass" id="list"><div class="empty">Reading the page's links…</div></div>
</main>
<div class="glass bar">
  <span class="grow sub" id="count">0 selected</span>
  <button class="primary" id="go" disabled>Download</button>
</div>
<script src="common.js"></script>
<script src="links.js"></script>
</body>
</html>

[package]
name = "kara-dm"
version = "0.3.1"
edition = "2024"
description = "Multi-connection download manager for Linux and Windows, compatible with the Neat Download Manager browser extension"
license = "Apache-2.0"
repository = "https://github.com/kamisama-v0/kara-dm"
readme = "README.md"
keywords = ["download-manager", "aria2", "gtk4", "libadwaita"]
categories = ["network-programming", "gui"]

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_6"] }
async-channel = "2.5.0"
getrandom = "0.4.3"
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_16"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
ureq = { version = "3.4.2", default-features = false, features = ["json"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
lto = "thin"
strip = true
